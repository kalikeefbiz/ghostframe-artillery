name: Deploy AetherWild Build 13 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-placeholder/**"
      - ".github/workflows/deploy-aetherwild-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "aetherwild-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify materialized WebGL build
        shell: bash
        run: |
          set -euo pipefail
          test -f "cloudflare-placeholder/index.html"
          test -f "cloudflare-placeholder/Build/Default WebGL.data"
          test -f "cloudflare-placeholder/Build/Default WebGL.wasm"
          ls -lh "cloudflare-placeholder/Build/Default WebGL.data" "cloudflare-placeholder/Build/Default WebGL.wasm"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cloudflare-placeholder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
