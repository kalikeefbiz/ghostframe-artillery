name: Unpack AetherWild M1 Source

on:
  push:
    branches: [main]
    paths:
      - AetherWild-M1-source.zip
      - .github/workflows/unpack-aetherwild-m1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aetherwild-source-unpack-main
  cancel-in-progress: false

jobs:
  unpack:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Detect transport ZIP
        id: archive
        shell: bash
        run: |
          if test -f AetherWild-M1-source.zip; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Upload AetherWild-M1-source.zip to repository root, then run this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate and unpack the matching M1 project
        if: steps.archive.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import shutil
          import stat
          import tempfile
          import zipfile
          
          root = Path.cwd()
          archive = root / 'AetherWild-M1-source.zip'
          expected = '8f2728f352809ba01b9e19c480e677459dd79b598b0a1a357ced822b28dd4d05'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Archive checksum does not match this M1 workflow. Upload the matching ZIP unchanged.')
          allowed = {'Assets', 'Packages', 'ProjectSettings', 'Docs', 'Tools', 'README.md', '.gitignore'}
          required = {'Assets/AetherWild/Scenes/Foundation.unity', 'Assets/AetherWild/Data/Mae.asset',
                      'Assets/AetherWild/Data/AetherBolt.asset', 'Packages/manifest.json',
                      'ProjectSettings/ProjectVersion.txt', 'ProjectSettings/EditorBuildSettings.asset',
                      'Docs/M1-ACCEPTANCE.md', 'Tools/verify_source.py'}
          for name in allowed:
              if (root / name).is_symlink():
                  raise SystemExit('Refusing to overwrite a symlink: ' + name)
          with tempfile.TemporaryDirectory(prefix='aetherwild-m1-') as temp:
              stage = Path(temp)
              with zipfile.ZipFile(archive) as z:
                  infos = z.infolist()
                  if len(infos) > 50000 or sum(i.file_size for i in infos) > 512 * 1024 * 1024:
                      raise SystemExit('Archive exceeds expected source limits.')
                  names = set()
                  for info in infos:
                      path = PurePosixPath(info.filename)
                      mode = info.external_attr >> 16
                      if (not path.parts or path.is_absolute() or '..' in path.parts or '\\' in info.filename
                              or ':' in info.filename or path.parts[0] not in allowed
                              or stat.S_ISLNK(mode) or (mode and stat.S_IFMT(mode) not in (0, stat.S_IFREG, stat.S_IFDIR))):
                          raise SystemExit('Unsafe or unexpected archive entry: ' + info.filename)
                      if info.filename.casefold() in names:
                          raise SystemExit('Duplicate archive entry: ' + info.filename)
                      names.add(info.filename.casefold())
                      destination = stage.joinpath(*path.parts)
                      if info.is_dir():
                          destination.mkdir(parents=True, exist_ok=True)
                      else:
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          destination.write_bytes(z.read(info))
              for name in required:
                  if not (stage / name).is_file():
                      raise SystemExit('Missing required Unity project file: ' + name)
              for name in ('Assets', 'Packages', 'ProjectSettings', 'Docs'):
                  if not (stage / name).is_dir():
                      raise SystemExit('Missing Unity project directory: ' + name)
              import subprocess
              subprocess.run(['python3', str(stage / 'Tools/verify_source.py'), str(stage)], check=True)
              # Only declared source roots are replaced. Git and GitHub Actions stay untouched.
              for item in stage.iterdir():
                  target = root / item.name
                  if target.exists():
                      if target.is_dir(): shutil.rmtree(target)
                      else: target.unlink()
                  if item.is_dir(): shutil.copytree(item, target)
                  else: shutil.copy2(item, target)
              # Remove the transport only after validation and copying succeeded.
              archive.unlink()
          print('M1 source extracted; .git and .github preserved.')
          PY
      - name: Commit and push M1 to main
        if: steps.archive.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- Assets Packages ProjectSettings Docs Tools README.md .gitignore AetherWild-M1-source.zip
          if git diff --cached --quiet; then
            echo "No extracted source changes to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Implement AetherWild M1 combat foundation"
          git push origin HEAD:main
          echo "M1 extracted and pushed to main." >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
